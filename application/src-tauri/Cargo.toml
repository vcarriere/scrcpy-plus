[package]
name = "scrcpy-plus"
version = "3.1.0"
description = "SCRCPY Plus"
authors = ["Frontesque"]
license = "GPL-3.0-only"
repository = "https://github.com/Frontesque/scrcpy-plus"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "scrcpyplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
preview = []

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-dialog = "2.8.4"
ureq = "3.5.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
